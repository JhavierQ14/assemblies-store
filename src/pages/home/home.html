<!DOCTYPE html>
<html lang="en">

<head>

               <div class="image">
                  <img src="../../assets/images/image2.png" alt="Memoria RAM DDR5">
               </div>
            </div>

            <div class="swiper-slide slide">
               <div class="content">
                  <span class="animated-typing" data-typing="Potencia tu experiencia"></span>

               </div>
               <div class="image">
                  <img src="../../assets/images/image3,3.png" alt="Tarjeta gr1fica RTX">
               </div>
            </div>

         </div>

      </div>

   </section>

   <section class="category">

      <h1 class="title">Nuestras Marcas</h1>

      <div class="box-container">

         <a href="../store/store.html" class="box">
            <img src="../../assets/images/asus.jpg" alt="ASUS Logo">
            <h3>Asus</h3>
         </a>

         <a href="../store/store.html" class="box">
            <img src="../../assets/images/msi-logo_b.png" alt="MSI Logo">
            <h3>MSI</h3>
         </a>

         <a href="../store/store.html" class="box">
            <img src="../../assets/images/acer.svg" alt="ACER Logo">
            <h3>ACER</h3>
         </a>

         <a href="../store/store.html" class="box">
            <img src="../../assets/images/hp.png" alt="HP Logo">

   <section class="products">

      <h1 class="title">Ultimos Ingresos</h1>

      <div class="box-container">
         <!-- ...productos de ejemplo omitidos por brevedad... -->
      </div>

      <div class="more-btn">
         <a href="../menu.html" class="btn">Ver más</a>
      </div>

   <footer class="footer">
