<!DOCTYPE html>
<html lang="es">
<head>
   <meta charset="UTF-8">
   <meta http-equiv="X-UA-Compatible" content="IE=edge">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Buscar Productos - Assemblies Store</title>
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
   <link rel="stylesheet" href="../../style.css">
   <link rel="stylesheet" href="./search.css">
</head>
<body>
   <header class="header">
      <div id="header"></div>
   </header>

   <div class="heading">
      <h3>Buscar Productos</h3>
      <p><a href="/">Inicio</a> <span> / Buscar</span></p>
   </div>

   <section class="search-form">
      <form action="" method="post">
         <input type="text" name="search_box" placeholder="Buscar productos..." maxlength="100" class="box" required>
         <button type="submit" class="fas fa-search" name="search_btn"></button>
      </form>
   </section>

   <section class="products" style="padding-top: 0;">
      <div class="box-container">
         <p class="empty">¡Busca un producto!</p>
      </div>
   </section>

   <footer class="footer">
      <div id="footer"></div>
   </footer>

   <script src="../../components/include-fragments.js"></script>
</body>
</html>
