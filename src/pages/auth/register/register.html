<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta http-equiv="X-UA-Compatible" content="IE=edge">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Registro - Assemblies Store</title>
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
   <link rel="stylesheet" href="./register.css">
   <link rel="stylesheet" href="../animated-bg/animated-bg.css">
</head>
<body>
<div class="login-container">
  <div class="login-box">
    <div class="logo-section">
      <h1>Assemblies Store</h1>
      <p>Tu tienda de hardware y componentes</p>
    </div>
    <form action="" method="post" class="login-form">
      <h3>Crea tu cuenta</h3>
      <div class="profile-upload">
        <div class="profile-preview-wrap">
          <img id="profilePreview" src="../../../assets/images/user.png" alt="preview" class="profile-preview" tabindex="0">
          <button type="button" id="uploadBtn" class="profile-upload-btn" title="Seleccionar foto de perfil"><i class="fas fa-camera"></i></button>
        </div>
        <input type="file" id="imageFile" name="imageFile" accept="image/*" class="hidden" />
        <input type="hidden" name="imagePerfil" value="" />
      </div>
      <div class="input-group">
        <i class="fas fa-user"></i>
        <input type="text" required maxlength="50" name="names" placeholder="Nombres" class="box">
      </div>
      <div class="input-group">
        <i class="fas fa-user"></i>
        <input type="text" required maxlength="50" name="surnames" placeholder="Apellidos" class="box">
      </div>
      <div class="input-group">
        <i class="fas fa-envelope"></i>
        <input type="email" required maxlength="50" name="email" placeholder="Correo electrónico" class="box">
      </div>
      <div class="input-group">
        <i class="fas fa-lock"></i>
        <input type="password" required maxlength="20" name="pass" placeholder="Contraseña" class="box">
      </div>
      <div class="input-group">
        <i class="fas fa-lock"></i>
        <input type="password" required maxlength="20" name="confirm_pass" placeholder="Confirmar contraseña" class="box">
      </div>
      <div class="input-group">
        <i class="fas fa-phone"></i>
        <input type="tel" maxlength="20" name="phone" placeholder="Teléfono" class="box">
      </div>
      <input type="submit" value="Registrarse" class="btn" name="submit">
  <p class="register-link">¿Ya tienes una cuenta? <a href="../login/login.html">Inicia sesión aquí</a></p>
    </form>
    <div class="social-login">
      <p class="social-title">O regístrate con</p>
      <button class="social-btn google"><i class="fab fa-google"></i> Google</button>
      <button class="social-btn facebook"><i class="fab fa-facebook-f"></i> Facebook</button>
      <button class="social-btn microsoft"><i class="fab fa-microsoft"></i> Microsoft</button>
    </div>
  </div>
</div>
<div class="animated-bg"></div>
<script src="../../../js/animated-bg.js"></script>
<script type="module" src="./register.js"></script>
</body>
</html>
